server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  profiles:
    # 默认 dev (H2 内存模式，无需安装 MySQL 即可秒级启动)；若要连接本地真实 MySQL，请改为 mysql
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: scan-order-backend-springboot

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 微信云托管监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
