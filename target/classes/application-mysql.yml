# 本地真实 MySQL 开发环境配置 (激活方式: 修改 application.yml 中 spring.profiles.active: mysql)
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true 允许本地自动创建 scan_order 数据库
    url: jdbc:mysql://localhost:3306/scan_order?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root          # 🚨 本地 MySQL 账号
    password: rootpassword  # 🚨 本地 MySQL 密码 (如 123456 / root)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never
