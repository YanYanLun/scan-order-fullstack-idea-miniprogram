# 本地开发环境配置 (默认采用 H2 内存数据库，零安装即开即用，秒级启动)
server:
  port: 8080

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 启用全字段自动转义，防止在任何 SQL 引擎中触碰保留字
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never
