# 本地开发环境配置 (默认采用 H2 内存数据库，零安装即开即用，秒级启动)
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL 并配置 NON_KEYWORDS=YEAR,MONTH,DAY，避免保留字冲突
    url: jdbc:h2:mem:scan_order;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR,MONTH,DAY
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 启用全字段自动转义，防止在任何 SQL 引擎中触碰保留字
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never # 数据由 DataInitializer.java 自动注入，具备跨平台兼容性
