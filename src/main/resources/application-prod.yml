# 微信云托管 (WeChat CloudRun) 生产环境配置
# 端口由微信云托管环境变量 PORT 注入 (默认为 80)
server:
  port: ${PORT:80}

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true

  sql:
    init:
      mode: never
